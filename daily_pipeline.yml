name: Daily ETF Data Pipeline

on:
  schedule:
    # 星期一至五 UTC 21:30 (美股盤後收市結算)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 下載專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝所需套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立數據目錄並初始化資料庫 (Init DB & Holdings)
        run: |
          mkdir -p data
          python db_manager.py
          python update_holdings.py

      - name: 執行每日盤後大盤與細分行業計算 (Run Daily Batch With Throttling)
        run: |
          python daily_batch.py

      - name: 自動儲存並提交更新後的資料庫 (Commit & Push DB)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/etf_system.db
          git diff-index --quiet HEAD || git commit -m "自動更新: 盤後市場寬度與 ETF 指標 [$(date +'%Y-%m-%d')]"
          git push
